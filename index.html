  <!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saral | Small tools for money, files and everyday work</title>
<meta name="description" content="EMI, SIP, CAGR, age calculator, income tax, BMI, chart maker, PDF and image tools, converters, resume and invoice makers. Everything runs in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#12172B; --muted:#5D6379; --line:#E2E5EC; --soft:#EBEEF4;
  --accent:#F2A516; --accent-soft:#FCEFD0; --accent-text:#8A5600; --ok:#1B7F4B; --bad:#B42318;
  --font:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1020; --surface:#151A2F; --ink:#EEF0F8; --muted:#9BA1B9; --line:#262C48; --soft:#1C2242;
    --accent:#F4B23C; --accent-soft:#2C2818; --accent-text:#F4B23C; --ok:#4CC38A; --bad:#FF8F80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1020; --surface:#151A2F; --ink:#EEF0F8; --muted:#9BA1B9; --line:#262C48; --soft:#1C2242;
  --accent:#F4B23C; --accent-soft:#2C2818; --accent-text:#F4B23C; --ok:#4CC38A; --bad:#FF8F80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;height:auto;overflow-y:auto;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;height:auto;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:100;border-radius:0 0 8px 0}
.skip:focus{left:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.err{color:var(--bad)}
.note{color:var(--muted);font-size:.86rem;max-width:68ch;margin:20px 0 0}

/* shell layout */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;height:auto}
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 18px 24px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:1.35rem;letter-spacing:-.03em;text-decoration:none}
.brand-sun-logo{width:34px;height:34px;flex-shrink:0;display:block}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:.92rem}
.ngroup{margin-bottom:14px}
.ngt{font-size:.8rem;color:var(--muted);padding:0 10px 4px}
.nlink{display:block;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:.95rem;color:var(--ink)}
.nlink:hover{background:var(--soft)}
.nlink[aria-current="page"]{background:var(--soft);font-weight:600}
.navfoot{margin-top:auto;font-size:.82rem;color:var(--muted)}
.navfoot p{margin:10px 0 0}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.86rem}
.topbar{display:none}
.scrim{display:none}
.main{padding:52px clamp(20px,5vw,72px) 110px;min-width:0;max-width:1180px;width:100%;height:auto}
.iconbtn{background:none;border:0;padding:8px;margin:-8px;cursor:pointer;border-radius:8px;display:inline-flex}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;min-height:auto}
  .topbar{display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
  .nav{position:fixed;z-index:40;top:0;left:0;bottom:0;width:min(84vw,320px);height:100%;background:var(--bg);padding-top:24px;padding-bottom:24px;transform:translateX(-102%);transition:transform .22s ease;border-right:1px solid var(--line)}
  .nav.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:30;background:rgba(10,12,24,.45)}
  .main{padding-top:32px}
}

/* headings */
.crumb{display:inline-block;font-size:.86rem;color:var(--muted);text-decoration:none;margin-bottom:18px}
.crumb:hover{color:var(--ink);text-decoration:underline}
.thead{margin-bottom:34px}
.thead h1{font-size:clamp(1.9rem,4.4vw,2.7rem);letter-spacing:-.03em;margin-bottom:10px}
.lede{color:var(--muted);max-width:60ch;margin:0;font-size:1.02rem}
.block{margin-top:44px}
.block>h2,.sub{font-size:1.15rem;margin:0 0 14px}
details.block>summary,details.fold>summary{cursor:pointer;font-weight:600;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.block>summary::-webkit-details-marker,details.fold>summary::-webkit-details-marker{display:none}
details.block>summary::before,details.fold>summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--soft);font-weight:500;line-height:1}
details[open].block>summary::before,details[open].fold>summary::before{content:"\2212"}
details.fold{margin:6px 0 26px;padding-top:14px;border-top:1px solid var(--line)}

/* home */
.hero h1{font-size:clamp(2.5rem,7vw,5rem);font-weight:500;letter-spacing:-.045em;line-height:1;max-width:15ch}
.hero .lede{margin-top:22px;font-size:1.12rem;max-width:52ch}
.index{margin-top:64px}
.igroup{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 32px;padding:26px 0;border-top:1px solid var(--line)}
.igroup h2{font-size:1.02rem}
.irow{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:2px 24px;padding:11px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow strong{font-weight:600;width:max-content;max-width:100%;text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:5px;transition:text-decoration-color .15s}
.irow:hover strong{text-decoration-color:var(--accent)}
.irow span{color:var(--muted)}
@media (max-width:700px){.igroup{grid-template-columns:1fr}.irow{grid-template-columns:1fr}}

/* calculators */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:start}
@media (max-width:1000px){.calc{grid-template-columns:minmax(0,1fr);gap:32px}}
.calc>.panel,.calc>.stick{position:sticky;top:24px}
@media (max-width:1000px){.calc>.panel,.calc>.stick{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px}
.field{margin-bottom:26px}
.field-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.field-top label{font-size:.92rem;color:var(--muted)}
.numwrap{display:inline-flex;align-items:baseline;gap:4px;border-bottom:1.5px solid var(--line);padding:1px 0;transition:border-color .15s}
.numwrap:focus-within{border-bottom-color:var(--ink)}
.numwrap i{font-style:normal;color:var(--muted);font-size:.95rem}
.num{border:0;background:transparent;font-weight:600;font-size:1.15rem;text-align:right;width:8.5em;padding:0;outline:none;font-variant-numeric:tabular-nums;min-width:0}
.num:focus-visible{outline:none}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;margin:0;--p:50%}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--ink) var(--p),var(--line) var(--p))}
.rng::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
.rng::-moz-range-progress{height:4px;border-radius:4px;background:var(--ink)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink);margin-top:-9px}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink)}
.rng:focus-visible{outline:none}
.rng:focus-visible::-webkit-slider-thumb{outline:2px solid var(--ink);outline-offset:3px}
.rng:focus-visible::-moz-range-thumb{outline:2px solid var(--ink);outline-offset:3px}

.big{font-size:clamp(2.6rem,6.4vw,4rem);font-weight:600;letter-spacing:-.04em;line-height:1.02;font-variant-numeric:tabular-nums;margin-top:6px;overflow-wrap:anywhere}
.big.mid{font-size:clamp(1.9rem,4vw,2.5rem)}
.words{color:var(--muted);margin-top:8px;font-size:.95rem;min-height:1.4em}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin:26px 0 12px}
.split>span{display:block;height:100%;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.split .a,.dot.a,.sw.a{background:var(--ink)}
.split .b,.dot.b,.sw.b{background:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row span:nth-child(2){flex:1;color:var(--muted)}
.row b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.legend{display:flex;gap:18px;font-size:.86rem;color:var(--muted);margin-top:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.93rem}
.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:8px 10px;white-space:nowrap}
.tbl td{text-align:right;padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.95rem;padding:11px 20px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;transition:transform .1s,opacity .15s,border-color .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{padding:7px 14px;font-size:.86rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;font-size:.9rem;color:var(--muted);padding:7px 15px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(10,12,30,.12)}
.field .seg{margin-top:2px}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.in:focus-visible{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
textarea.in{resize:vertical;min-height:70px;line-height:1.45}
select.in{appearance:auto}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted);min-width:0}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.chk-l{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.chk-l input{width:18px;height:18px;accent-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* drop + files */
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px dashed var(--line);border-radius:16px;padding:38px 20px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s;position:relative}
.drop strong{color:var(--ink)}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--ink);background:var(--surface)}
.files{margin:18px 0 0;padding:0;list-style:none}
.files li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.files .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .mt{color:var(--muted);font-size:.84rem;white-space:nowrap}
.files img{width:40px;height:40px;object-fit:cover;border-radius:6px;background:var(--soft)}
.ib{border:1px solid var(--line);background:transparent;border-radius:8px;width:32px;height:32px;cursor:pointer;line-height:1}
.ib:hover{border-color:var(--ink)}
.ib[disabled]{opacity:.3;cursor:not-allowed}
.imgprev{background:repeating-conic-gradient(var(--soft) 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:12px;display:grid;place-items:center;padding:10px;margin-bottom:18px;min-height:120px}
.imgprev img{max-width:100%;max-height:340px;object-fit:contain;display:block;border-radius:4px}

/* converter */
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin:24px 0}
@media (max-width:700px){.conv{grid-template-columns:1fr}}
.cv{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px}
.cv .val{width:100%;border:0;background:transparent;font-size:clamp(1.7rem,4vw,2.4rem);font-weight:600;letter-spacing:-.03em;outline:none;font-variant-numeric:tabular-nums;padding:0;margin-bottom:8px;min-width:0;overflow-wrap:anywhere}
.cv output.val{display:block}
.cv .val:focus-visible{outline:none}
.cv:focus-within{border-color:var(--ink)}
.cv select{width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0 0;color:var(--muted);font-size:.95rem}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.swap:hover{border-color:var(--ink)}
.ratesg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0}

/* planner */
.pbody{margin-top:26px;max-width:720px}
.datenav{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.datenav strong{font-size:1.15rem;min-width:11ch}
.addrow{display:flex;gap:10px;margin-bottom:18px}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.tasks li.empty,.empty{color:var(--muted);border-top:1px solid var(--line);padding:16px 0}
.tasks .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.tasks li.done .tx{color:var(--muted);text-decoration:line-through}
.chkb{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.chkb[aria-checked="true"]{background:var(--accent);border-color:var(--ink)}
.chkb[aria-checked="true"]::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.84rem;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.x:hover,.x.arm{color:var(--bad)}
.tfoot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-top:14px}
.hrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:16px 0;border-top:1px solid var(--line)}
.hname{flex:1 1 190px;min-width:0}
.hname b{display:block;font-weight:600;overflow-wrap:anywhere}
.hname small{color:var(--muted)}
.hdots{display:flex;gap:6px}
.hd{width:34px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);padding:0}
.hd.on{background:var(--accent);border-color:var(--ink);color:var(--ink);font-weight:700}
.hd.today{border-color:var(--ink)}
.in.jarea{min-height:260px;font-size:1.02rem;line-height:1.6}
.jlist{list-style:none;margin:0;padding:0}
.jlist button{display:flex;gap:16px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer}
.jlist b{flex:none;width:9.5em;font-weight:600}
.jlist span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* password */
.pwout{font-family:var(--mono);font-size:clamp(1.15rem,3vw,1.55rem);letter-spacing:.02em;word-break:break-all;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-height:5.2em;display:flex;align-items:center}
.meter{display:flex;gap:4px;margin:16px 0 8px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--ok)}
.meter.weak i.on{background:var(--bad)}
.meter.fair i.on{background:var(--accent)}

/* make: resume + invoice */
.mk{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:1100px){.mk{grid-template-columns:minmax(0,1fr)}.mk[data-view="edit"] .pv{display:none}.mk[data-view="preview"] .fm{display:none}}
@media (min-width:1101px){.viewseg{display:none}}
.viewseg{margin-bottom:22px}
.fm h3{font-size:1.02rem;margin:26px 0 12px}
.fm h3:first-child{margin-top:0}
.entry{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface)}
.pv{position:sticky;top:24px}
@media (max-width:1100px){.pv{position:static}}
.paperwrap{width:100%;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:#fff}
.paper{width:794px;min-height:1123px;background:#fff;color:#151826;padding:54px 58px;font-size:13px;line-height:1.45;transform-origin:top left;font-family:Arial,Helvetica,sans-serif}
.paper *{color:inherit}
.paper .mut{color:#5b6070}
.r-name{font-size:30px;font-weight:700;letter-spacing:-.01em;margin:0}
.r-title{font-size:15px;margin-top:2px;color:#4b5060}
.r-contact{font-size:11.5px;margin-top:8px;color:#5b6070}
.r-sec{font-size:11.5px;font-weight:700;letter-spacing:.03em;margin:18px 0 7px;padding-bottom:3px;border-bottom:1px solid #c9ccd6}
.r-item{margin-bottom:10px}
.r-line{display:flex;justify-content:space-between;gap:14px}
.r-line b{font-weight:700}
.r-sub{font-style:italic;color:#5b6070;font-size:12px}
.paper ul{margin:4px 0 0;padding-left:17px}
.paper li{margin:1px 0}
.paper p{margin:0}
.t-serif{font-family:'Times New Roman',Times,serif;font-size:14px}
.t-serif .r-head{text-align:center}
.t-serif .r-sec{text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.t-accent .r-head{border-bottom:3px solid #F2A516;padding-bottom:12px}
.t-accent .r-sec{color:#8A5600;border-bottom-color:#F2A516}
.i-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:28px}
.i-top h2{font-size:30px;font-weight:700;letter-spacing:-.02em;color:#151826}
.i-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;white-space:pre-line}
.i-tbl{width:100%;border-collapse:collapse;font-size:12px}
.i-tbl th{background:#f1f2f6;text-align:right;padding:7px 8px;font-weight:700}
.i-tbl td{padding:8px;border-bottom:1px solid #e3e5ec;text-align:right;vertical-align:top}
.i-tbl th:nth-child(2),.i-tbl td:nth-child(2){text-align:left;width:34%}
.i-tbl th:first-child,.i-tbl td:first-child{text-align:left;width:28px}
.i-tot{margin:16px 0 0 auto;width:56%;font-size:12.5px}

/* lazy libraries */
const loaded = {};
function loadScript(key, urls, test) {

const LIBS = {

/* Core Math & Pure Logic */

/* EMI */
function calcEmi(P, rate, months) {
  months = Math.max(1, Math.round(months));
  const r = rate / 1200;
  let e;
  if (r === 0) e = P / months;
  else { const f = Math.pow(1 + r, months); e = P * r * f / (f - 1); }
  const total = e * months;
  return { emi: e, total: total, interest: total - P, months: months };
}
function scheduleEmi(P, rate, months) {
  months = Math.max(1, Math.round(months));
  const r = rate / 1200, e = calcEmi(P, rate, months).emi;
  let bal = P; const rows = [];
  for (let m = 1; m <= months; m++) {
    const i = bal * r, p = e - i;
    bal = Math.max(0, bal - p);
    rows.push({ m: m, interest: i, principal: p, balance: bal, emi: e });
  }
  return rows;
}
function yearlyRows(rows) {
  const ys = [];
  rows.forEach(function (x) {
    const y = Math.ceil(x.m / 12);
    let o = ys[y - 1];
    if (!o) o = ys[y - 1] = { year: y, principal: 0, interest: 0, balance: 0 };
    o.principal += x.principal; o.interest += x.interest; o.balance = x.balance;
  });
  return ys;
}

/* SIP */
function calcSip(P, rate, years, step, infl) {
  years = Math.max(1, Math.round(years));
  const i = rate / 1200;
  let bal = 0, inv = 0, contrib = P;
  const yrs = [];
  for (let y = 1; y <= years; y++) {
    for (let m = 0; m < 12; m++) { bal = (bal + contrib) * (1 + i); inv += contrib; }
    yrs.push({ label: 'Y' + y, a: inv, b: Math.max(0, bal - inv) });
    contrib *= 1 + step / 100;
  }
  return { inv: inv, value: bal, gain: bal - inv, real: bal / Math.pow(1 + infl / 100, years), yrs: yrs };
}

/* CAGR */
function calcCagr(initial, final, years) {
  if (initial <= 0 || final <= 0 || years <= 0) return { cagr: 0, absolute: 0, totalGain: 0, yrs: [] };
  const cagr = (Math.pow(final / initial, 1 / years) - 1) * 100;
  const absolute = ((final - initial) / initial) * 100;
  const totalGain = final - initial;
  const yrs = [];
  for (let y = 1; y <= Math.round(years); y++) {
    const val = initial * Math.pow(1 + cagr / 100, y);
    yrs.push({ label: 'Y' + y, a: initial, b: Math.max(0, val - initial) });
  }
  return { cagr: cagr, absolute: absolute, totalGain: totalGain, yrs: yrs };
}

/* Age & Eligibility */
function calcAgeDetails(dobStr, targetStr) {
  if (!dobStr) return null;
  const dob = parseDateSafe(dobStr);
  const target = targetStr ? parseDateSafe(targetStr) : new Date();
  if (!dob || !target || isNaN(dob.getTime()) || isNaN(target.getTime()) || dob > target) return null;

  let y = target.getFullYear() - dob.getFullYear();
  let m = target.getMonth() - dob.getMonth();
  let d = target.getDate() - dob.getDate();

  if (d < 0) {
    m--;
    const prevMonthDays = new Date(target.getFullYear(), target.getMonth(), 0).getDate();
    d += prevMonthDays;
  }
  if (m < 0) {
    y--;
    m += 12;
  }

  const diffTime = target.getTime() - dob.getTime();
  const totalDays = Math.floor(diffTime / 864e5);
  const totalWeeks = Math.floor(totalDays / 7);
  const totalMonths = y * 12 + m;

  let nextBday = new Date(target.getFullYear(), dob.getMonth(), dob.getDate());
  if (nextBday < target) {
    nextBday = new Date(target.getFullYear() + 1, dob.getMonth(), dob.getDate());
  }
  const daysToNext = Math.ceil((nextBday.getTime() - target.getTime()) / 864e5);

  const checks = [
    { name: 'Voting / Adult (18+)', min: 18, max: Infinity, desc: 'Eligible for voter ID, general legal contracts, and driving license in India.' },
    { name: 'Marriage Legal Age (21+)', min: 21, max: Infinity, desc: 'Eligible marriage age for males (and standard adult legal obligations).' },
    { name: 'General Govt Job Exam (18 - 32)', min: 18, max: 32, desc: 'Standard general age bracket for UPSC CSE, SSC, and public sector services.' },
    { name: 'Armed Forces / NDA (16.5 - 19.5)', min: 16.5, max: 19.5, desc: 'Entry bracket for National Defence Academy / Naval Academy exams.' },
    { name: 'Senior Citizen Tax Benefit (60+)', min: 60, max: 79, desc: 'Eligible for senior citizen tax slabs, train concessions, and special FD rates.' },
    { name: 'Super Senior Citizen (80+)', min: 80, max: Infinity, desc: 'Special income tax slab benefits and healthcare provisions in India.' }
  ];

  const decimalAge = y + (m / 12) + (d / 365);
  const eligibilities = checks.map(function (c) {
    const ok = decimalAge >= c.min && decimalAge <= c.max;
    return { name: c.name, ok: ok, desc: c.desc, range: (c.max === Infinity ? c.min + '+ years' : c.min + ' - ' + c.max + ' years') };
  });

  return { y: y, m: m, d: d, totalDays: totalDays, totalWeeks: totalWeeks, totalMonths: totalMonths, daysToNext: daysToNext, eligibilities: eligibilities };
}

/* Income tax */
const NEW_SLABS = [[400000, 0], [800000, .05], [1200000, .10], [1600000, .15], [2000000, .20], [2400000, .25], [Infinity, .30]];
function oldSlabs(age) {
  const ex = age === 's80' ? 500000 : age === 's60' ? 300000 : 250000;
  const a = [[ex, 0]];
  if (ex < 500000) a.push([500000, .05]);
  a.push([1000000, .20], [Infinity, .30]);
  return a;
}
function slabTax(inc, slabs) {
  let tax = 0, prev = 0;
  for (let k = 0; k < slabs.length; k++) {
    const lim = slabs[k][0], rate = slabs[k][1];
    if (inc > prev) tax += (Math.min(inc, lim) - prev) * rate;
    prev = lim;
    if (inc <= lim) break;
  }
  return tax;
}
function taxOn(inc, regime, age) {
  const slabs = regime === 'new' ? NEW_SLABS : oldSlabs(age);
  const base = slabTax(inc, slabs);
  let rebate = 0;
  if (regime === 'new') {
    if (inc <= 1200000) rebate = base;
    else if (base > inc - 1200000) rebate = base - (inc - 1200000);
  } else if (inc <= 500000) rebate = Math.min(base, 12500);
  const tax = base - rebate;
  const th = [[5e6, .10], [1e7, .15], [2e7, .25], [5e7, regime === 'old' ? .37 : .25]];
  let T = 0, rate = 0, prevRate = 0;
  for (let k = 0; k < th.length; k++) {
    if (inc > th[k][0]) { T = th[k][0]; rate = th[k][1]; prevRate = k > 0 ? th[k - 1][1] : 0; }
  }
  let sur = tax * rate;
  if (rate > 0) {
    const baseT = slabTax(T, slabs);
    const taxT = baseT + baseT * prevRate;
    if (tax + sur > taxT + (inc - T)) sur = Math.max(0, taxT + (inc - T) - tax);
  }
  const cess = (tax + sur) * 0.04;
  return { taxable: inc, base: base, rebate: rebate, sur: sur, cess: cess, total: tax + sur + cess };
}
function hraExemption(basic, hra, rent, metro) {
  if (!(hra > 0) || !(rent > 0) || !(basic > 0)) return 0;
  return Math.max(0, Math.min(hra, rent - 0.10 * basic, (metro ? 0.5 : 0.4) * basic));
}
function taxCompare(s) {
  const gross = (s.income || 0) + (s.other || 0);
  const sal = s.sal === 'yes';
  const newTaxable = Math.max(0, gross - (sal ? 75000 : 0));
  const hra = hraExemption(s.hraBasic, s.hraRecv, s.rent, s.metro === 'yes');
  const ded = (sal ? 50000 : 0) + hra + Math.min(s.homeLoan || 0, 200000) + Math.min(s.c80 || 0, 150000) +
    Math.min(s.d80 || 0, 100000) + Math.min(s.nps || 0, 50000) + (s.otherDed || 0);
  const oldTaxable = Math.max(0, gross - ded);
  const n = taxOn(newTaxable, 'new', s.age), o = taxOn(oldTaxable, 'old', s.age);
  n.gross = o.gross = gross; o.hra = hra; o.deductions = ded;
  return { new: n, old: o };
}

/* Retirement */
function calcRetire(s) {
  const n = Math.max(0, s.retAge - s.age), m = Math.max(1, s.life - s.retAge);
  const inf = s.infl / 100, rPre = s.pre / 100, rPost = s.post / 100;
  const expAtRet = s.expense * Math.pow(1 + inf, n);
  const A = expAtRet * 12;
  const q = (1 + inf) / (1 + rPost);
  const corpus = Math.abs(q - 1) < 1e-9 ? A * m : A * (1 - Math.pow(q, m)) / (1 - q);
  const fvExisting = s.saved * Math.pow(1 + rPre, n);
  const gap = Math.max(0, corpus - fvExisting);
  const im = Math.pow(1 + rPre, 1 / 12) - 1, N = n * 12;
  const fac = function (k) { return im === 0 ? k : (Math.pow(1 + im, k) - 1) / im * (1 + im); };
  const sip = gap > 0 && N > 0 ? gap / fac(N) : 0;
  const pts = [];
  for (let y = 0; y <= n; y++) pts.push({ x: s.age + y, y: s.saved * Math.pow(1 + rPre, y) + sip * fac(y * 12) });
  let bal = pts[pts.length - 1].y;
  for (let k = 0; k < m; k++) {
    bal = (bal - A * Math.pow(1 + inf, k)) * (1 + rPost);
    pts.push({ x: s.retAge + k + 1, y: Math.max(0, bal) });
  }
  return { n: n, m: m, expAtRet: expAtRet, corpus: corpus, fvExisting: fvExisting, gap: gap, sip: sip, pts: pts };
}

/* BMI helper */
function calcBmi(weightKg, heightCm) {
  if (!(weightKg > 0) || !(heightCm > 0)) return { bmi: 0, cat: '', color: '', minW: 0, maxW: 0 };
  const hM = heightCm / 100;
  const bmi = weightKg / (hM * hM);
  let cat = 'Normal weight', color = 'var(--ok)';
  if (bmi < 18.5) { cat = 'Underweight'; color = 'var(--accent)'; }
  else if (bmi >= 25 && bmi < 30) { cat = 'Overweight'; color = 'var(--accent-text)'; }
  else if (bmi >= 30) { cat = 'Obese'; color = 'var(--bad)'; }
  return { bmi: bmi, cat: cat, color: color, minW: 18.5 * (hM * hM), maxW: 24.9 * (hM * hM) };
}

function parseRanges(str, total) {
  const out = [];

  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = function (x) { return x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? '-' + a[x % 10] : ''); };

function renderChartMaker(el) {
  const s = chartState;
  el.innerHTML = head('Graph & pie chart tool', 'Put in your values, choose your style and instantly generate clean bar, line or pie charts with high-resolution image export.') +
    seg('ctype', [['pie', 'Pie chart'], ['bar', 'Bar graph'], ['line', 'Line graph']], s.type) +
    '<div class="calc" style="margin-top:26px"><div class="inputs">' +
    fld('Chart title', 'title', s.title) +
    '<div style="margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:1.02rem;margin:0">Data points</h3>' +
    '<button class="btn ghost small" id="cadd" type="button">+ Add value</button></div>' +
    '<div id="citems"></div>' +
    '</div><div class="panel stick">' +
    '<div class="imgprev" style="background:var(--surface);min-height:300px"><canvas id="cCanvas" width="720" height="500" style="width:100%;height:auto;max-height:380px;display:block"></canvas></div>' +
    '<div class="btnrow"><button class="btn" id="cdl" type="button">Download chart (PNG)</button></div>' +
    '</div></div>';

  bindPaths(el, s, function () { drawPreview(); });
  onSeg(el, 'ctype', function (v) { s.type = v; drawPreview(); });

  $('#cadd', el).onclick = function () {
    const palette = ['#F2A516', '#1B7F4B', '#12172B', '#3B82F6', '#8B5CF6', '#EC4899', '#14B8A6', '#F97316'];
    const nextCol = palette[s.items.length % palette.length];
    s.items.push({ label: 'Item ' + (s.items.length + 1), val: 100, color: nextCol });
    drawList(); drawPreview();
  };

  function drawList() {
    const box = $('#citems', el);
    box.innerHTML = s.items.map(function (it, idx) {
      return '<div class="entry" style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 42px 30px;gap:8px;align-items:center;padding:10px">' +
        '<input class="in" style="padding:6px 8px;font-size:.88rem" placeholder="Label" data-idx="' + idx + '" data-k="label" value="' + esc(it.label) + '">' +
        '<input class="in" type="number" step="any" style="padding:6px 8px;font-size:.88rem" placeholder="Value" data-idx="' + idx + '" data-k="val" value="' + it.val + '">' +
        '<input type="color" data-idx="' + idx + '" data-k="color" value="' + (it.color || '#12172B') + '" style="border:0;padding:0;background:none;width:100%;height:32px;cursor:pointer">' +
        (s.items.length > 1 ? '<button class="x" type="button" data-del="' + idx + '" title="Delete" style="padding:0">✕</button>' : '<span></span>') +
        '</div>';
    }).join('');

    box.oninput = function (e) {
      const idx = e.target.dataset.idx, k = e.target.dataset.k;
      if (idx == null || !k) return;
      s.items[idx][k] = k === 'val' ? parseFloat(e.target.value) || 0 : e.target.value;
      drawPreview();
    };

    box.onclick = function (e) {
      const d = e.target.dataset.del;
      if (d != null) {
        s.items.splice(+d, 1);
        drawList(); drawPreview();
      }
    };
  }

  function drawPreview() {
    const cv = $('#cCanvas', el); if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 720, H = cv.height = 500;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#12172B';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(s.title || 'Chart', W / 2, 40);

    const valid = s.items.filter(function (it) { return it.val > 0; });
    const total = valid.reduce(function (a, b) { return a + b.val; }, 0);

    if (!valid.length || total <= 0) {
      ctx.fillStyle = '#9BA1B9'; ctx.font = '16px system-ui';
      ctx.fillText('Enter positive values to render the chart', W / 2, H / 2);
      return;
    }

    if (s.type === 'pie') {
      const cx = W / 2 - 80, cy = H / 2 + 10, r = 160;
      let start = -Math.PI / 2;
      valid.forEach(function (d) {
        const slice = (d.val / total) * (Math.PI * 2);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, start + slice);
        ctx.closePath();
        ctx.fillStyle = d.color;
        ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
        start += slice;
      });

      let ly = cy - (valid.length * 12);
      ctx.textAlign = 'left';
      valid.forEach(function (d) {
        ctx.fillStyle = d.color;
        ctx.fillRect(W - 200, ly - 10, 14, 14);
        ctx.fillStyle = '#12172B';
        ctx.font = '13px system-ui, sans-serif';
        const pct = ((d.val / total) * 100).toFixed(1) + '%';
        ctx.fillText(d.label + ' (' + pct + ')', W - 178, ly + 2);
        ly += 26;
      });
    } else if (s.type === 'bar') {
      const max = Math.max.apply(null, valid.map(function (d) { return d.val; }));
      const padL = 70, padR = 40, padB = 80, padT = 70;
      const ch = H - padB - padT, cw = W - padL - padR;
      const bw = cw / valid.length;

      ctx.strokeStyle = '#E2E5EC'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();

      valid.forEach(function (d, i) {
        const bh = (d.val / max) * ch;
        const bx = padL + i * bw + bw * 0.15;
        const barW = bw * 0.7;
        const by = H - padB - bh;
        ctx.fillStyle = d.color;
        ctx.fillRect(bx, by, barW, bh);

        ctx.fillStyle = '#12172B'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
        ctx.fillText(String(d.val), bx + barW / 2, by - 8);
        ctx.fillStyle = '#5D6379';
        ctx.fillText(d.label, bx + barW / 2, H - padB + 20);
      });
    } else if (s.type === 'line') {
      const max = Math.max.apply(null, valid.map(function (d) { return d.val; }));
      const padL = 70, padR = 40, padB = 80, padT = 70;
      const ch = H - padB - padT, cw = W - padL - padR;

      ctx.strokeStyle = '#E2E5EC'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();

      const step = cw / Math.max(1, valid.length - 1);
      ctx.strokeStyle = '#12172B'; ctx.lineWidth = 3;
      ctx.beginPath();
      valid.forEach(function (d, i) {
        const px = padL + i * step;
        const py = H - padB - (d.val / max) * ch;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();

      valid.forEach(function (d, i) {
        const px = padL + i * step;
        const py = H - padB - (d.val / max) * ch;
        ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = '#12172B'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
        ctx.fillText(String(d.val), px, py - 12);
        ctx.fillStyle = '#5D6379';
        ctx.fillText(d.label, px, H - padB + 20);
      });
    }
  }

  $('#cdl', el).onclick = function () {
    const cv = $('#cCanvas', el);
    if (cv) cv.toBlob(function (blob) { saveFile((s.title || 'chart').toLowerCase().replace(/\s+/g, '-') + '.png', blob); }, 'image/png');
  };

  drawList();
  drawPreview();
}

/* 9. PDF Toolkit */
const pdfState = { mode: 'merge', files: [], range: '1-2', action: 'keep', imgSize: 'a4', margin: true, busy: false, wordDoc: null };
const baseName = function (n) { return String(n).replace(/\.[^.]+$/, ''); };

function readImageEl(file) {
  return new Promise(function (res, rej) {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = function () { res({ img: img, url: url }); };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
async function rasterToPng(file) {
  const r = await readImageEl(file), c = document.createElement('canvas');
  c.width = r.img.naturalWidth; c.height = r.img.naturalHeight;
  c.getContext('2d').drawImage(r.img, 0, 0);
  URL.revokeObjectURL(r.url);
  const blob = await new Promise(function (res) { c.toBlob(res, 'image/png'); });
  return new Uint8Array(await blob.arrayBuffer());
}

    } else if (m === 'images') {

        (s.imgSize === 'a4' ? '<label class="chk-l"><input type="checkbox" id="mg"' + (s.margin ? ' checked' : '') + '>Add margins</label>' : '') + '</div>';

    }

    const accept = isImg ? 'image/*' : m === 'word2pdf' ? '.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document' : 'application/pdf,.pdf';
    const title = m === 'merge' ? 'Choose PDFs to merge' : m === 'extract' ? 'Choose a PDF' : m === 'pdf2word' ? 'Choose a PDF to convert' : m === 'word2pdf' ? 'Choose a Word document (.docx)' : 'Choose images';
    const fileListHtml = m === 'word2pdf' ? (s.wordDoc ? '<ul class="files"><li><span class="nm">' + esc(s.wordDoc.name) + '</span><span class="mt">' + bytesFmt(s.wordDoc.size) + '</span><button class="ib" data-a="rmw" aria-label="Remove">\u2715</button></li></ul>' : '') : (s.files.length ? '<ul class="files">' + list + '</ul>' : '');

    b.onclick = function (e) {
      const t = e.target.closest('[data-a]'); if (!t) return;
      const a = t.dataset.a, i = +t.dataset.i;
      if (a === 'rm') { const f = s.files.splice(i, 1)[0]; if (f && f.url) URL.revokeObjectURL(f.url); draw(); }
      else if (a === 'rmw') { s.wordDoc = null; draw(); }
      else if (a === 'up' && i > 0) { s.files.splice(i - 1, 0, s.files.splice(i, 1)[0]); draw(); }
      else if (a === 'down' && i < s.files.length - 1) { s.files.splice(i + 1, 0, s.files.splice(i, 1)[0]); draw(); }
      else if (a === 'go') run(false);
      else if (a === 'split') run(true);
      else if (a === 'p2w') convertPdfToWord();
      else if (a === 'w2p') convertWordToPdf();

    b.onchange = function (e) { if (e.target.id === 'mg') s.margin = e.target.checked; };

    onSegOnce(b, 'action', function (v) { s.action = v; });

  function onSegOnce(root, name, cb) {
    $$('.seg[data-seg="' + name + '"] button', root).forEach(function (btn) {
      btn.addEventListener('click', function () {
        $$('button', btn.parentNode).forEach(function (x) { x.setAttribute('aria-pressed', String(x === btn)); });
        cb(btn.dataset.v);
      });
    });
  }

  async function addFiles(files) {
    try {
      if (s.mode === 'word2pdf') {
        const f = files[0];
        if (!/\.docx$/i.test(f.name)) { toast('Please choose a .docx Word document.'); return; }
        s.wordDoc = f;
        draw();
        return;
      }
      await LIBS.pdf();
      if (s.mode === 'extract' || s.mode === 'pdf2word') { clearPdfFiles(); files = files.slice(0, 1); }
      for (let k = 0; k < files.length; k++) {
        const f = files[k];
        if (s.mode === 'images') {
          if (!/^image\//.test(f.type)) { toast(f.name + ' is not an image.'); continue; }
          s.files.push({ id: uid(), name: f.name, size: f.size, type: f.type, file: f, url: URL.createObjectURL(f) });
        } else {
          if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { toast(f.name + ' is not a PDF.'); continue; }
          try {
            const bytes = new Uint8Array(await f.arrayBuffer());
            const doc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
            s.files.push({ id: uid(), name: f.name, size: f.size, bytes: bytes, pages: doc.getPageCount() });
          } catch (e) { toast('Could not read ' + f.name + '. It may be damaged or password-protected.'); }
        }
      }
    } catch (e) { toast(e.message); }
    draw();
  }

  async function convertPdfToWord() {
    if (s.busy || !s.files[0]) return;
    s.busy = true; draw();
    try {
      await LIBS.zip();
      await LIBS.pdfjs();
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const f = s.files[0];
      const loadingTask = pdfjsLib.getDocument({ data: f.bytes });
      const pdf = await loadingTask.promise;
      let bodyXml = '';

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        let lastY = null, lineText = '';

        for (let i = 0; i < textContent.items.length; i++) {
          const item = textContent.items[i];
          const curY = Math.round(item.transform[5]);
          if (lastY !== null && Math.abs(curY - lastY) > 6) {
            if (lineText.trim()) {
              bodyXml += '<w:p><w:r><w:t xml:space="preserve">' + esc(lineText) + '</w:t></w:r></w:p>';
            }
            lineText = '';
          }
          lineText += (lineText ? ' ' : '') + item.str;
          lastY = curY;
        }
        if (lineText.trim()) {
          bodyXml += '<w:p><w:r><w:t xml:space="preserve">' + esc(lineText) + '</w:t></w:r></w:p>';
        }
        if (pageNum < pdf.numPages) {
          bodyXml += '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
        }
      }
      if (!bodyXml) {
        bodyXml = '<w:p><w:r><w:t>(No extractable text found in this PDF)</w:t></w:r></w:p>';
      }

      const zip = new JSZip();
      zip.file('[Content_Types].xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
        '</Types>'
      );
      zip.file('_rels/.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
        '</Relationships>'
      );
      zip.file('word/_rels/document.xml.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>'
      );
      zip.file('word/document.xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
        '<w:body>' + bodyXml + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/></w:sectPr></w:body></w:document>'
      );

      const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      await saveFile(baseName(f.name) + '.docx', blob, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    } catch (err) {
      toast('Could not convert PDF to Word. ' + (err.message || ''));
    }
    s.busy = false; draw();
  }

  async function convertWordToPdf() {
    if (s.busy || !s.wordDoc) return;
    s.busy = true; draw();
    try {
      await LIBS.mammoth();
      await LIBS.pdf();
      const ab = await s.wordDoc.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: ab });
      const raw = result.value || '';
      const paragraphs = raw.split(/\r?\n\r?\n/).map(function (p) { return p.replace(/\s+/g, ' ').trim(); }).filter(Boolean);

      const PL = PDFLib;
      const doc = await PL.PDFDocument.create();
      const font = await doc.embedFont(PL.StandardFonts.Helvetica);
      const W = 595.28, H = 841.89, M = 54, CW = W - 2 * M, size = 11, lineLead = 16, paraLead = 12;
      let page = doc.addPage([W, H]), y = H - M;

      const lines = [];
      paragraphs.forEach(function (para) {
        const words = sanitizePdf(para).split(' ');
        let cur = '';
        words.forEach(function (wd) {
          const test = cur ? cur + ' ' + wd : wd;
          if (cur && font.widthOfTextAtSize(test, size) > CW) {
            lines.push(cur); cur = wd;
          } else cur = test;
        });
        if (cur) lines.push(cur);
        lines.push(null);
      });

      lines.forEach(function (ln) {
        if (ln === null) { y -= paraLead; return; }
        if (y - lineLead < M) { page = doc.addPage([W, H]); y = H - M; }
        page.drawText(ln, { x: M, y: y, size: size, font: font, color: PL.rgb(0.08, 0.09, 0.15) });
        y -= lineLead;
      });

      if (!paragraphs.length) {
        page.drawText('(Blank Word document)', { x: M, y: y, size: size, font: font, color: PL.rgb(0.4, 0.4, 0.4) });
      }

      await saveFile(baseName(s.wordDoc.name) + '.pdf', await doc.save(), 'application/pdf');
    } catch (err) {
      toast('Could not convert Word to PDF. ' + (err.message || ''));
    }
    s.busy = false; draw();
  }

  async function run(split) {
    if (s.busy) return;
    s.busy = true; draw();
    try {
      await LIBS.pdf();
      const PD = PDFLib.PDFDocument;
      if (s.mode === 'merge') {
        const out = await PD.create();
        for (let k = 0; k < s.files.length; k++) {
          const src = await PD.load(s.files[k].bytes, { ignoreEncryption: true });
          (await out.copyPages(src, src.getPageIndices())).forEach(function (p) { out.addPage(p); });
        }
        await saveFile('merged.pdf', await out.save(), 'application/pdf');
      } else if (s.mode === 'extract') {
        const f = s.files[0], src = await PD.load(f.bytes, { ignoreEncryption: true }), total = src.getPageCount();
        if (split) {
          await LIBS.zip();
          const zip = new JSZip();
          for (let i = 0; i < total; i++) {
            const d = await PD.create(); const [p] = await d.copyPages(src, [i]); d.addPage(p);
            zip.file(baseName(f.name) + '-page-' + (i + 1) + '.pdf', await d.save());
          }
          await saveFile(baseName(f.name) + '-pages.zip', await zip.generateAsync({ type: 'blob' }), 'application/zip');
        } else {
          const picked = parseRanges(s.range, total);
          if (!picked || !picked.length) { toast('Enter pages like 1-3, 5 within 1 to ' + total + '.'); }
          else {
            let idx = picked.filter(function (v, i, a) { return a.indexOf(v) === i; });
            if (s.action === 'remove') idx = src.getPageIndices().filter(function (i) { return idx.indexOf(i) < 0; });
            if (!idx.length) toast('That would remove every page.');
            else {
              const out = await PD.create();
              (await out.copyPages(src, idx)).forEach(function (p) { out.addPage(p); });
              await saveFile(baseName(f.name) + '-edited.pdf', await out.save(), 'application/pdf');
            }
          }
        }
      } else {
        const out = await PD.create();
        for (let k = 0; k < s.files.length; k++) {
          const f = s.files[k]; let img;
          if (f.type === 'image/jpeg') img = await out.embedJpg(new Uint8Array(await f.file.arrayBuffer()));
          else if (f.type === 'image/png') img = await out.embedPng(new Uint8Array(await f.file.arrayBuffer()));
          else img = await out.embedPng(await rasterToPng(f.file));
          const iw = img.width, ih = img.height;
          if (s.imgSize === 'fit') {
            const k2 = Math.min(1, 1000 / Math.max(iw, ih)), w = iw * k2, h = ih * k2;
            out.addPage([w, h]).drawImage(img, { x: 0, y: 0, width: w, height: h });
          } else {
            const land = iw > ih, W = land ? 841.89 : 595.28, H = land ? 595.28 : 841.89, mg = s.margin ? 36 : 0;
            const sc = Math.min((W - 2 * mg) / iw, (H - 2 * mg) / ih), w = iw * sc, h = ih * sc;
            out.addPage([W, H]).drawImage(img, { x: (W - w) / 2, y: (H - h) / 2, width: w, height: h });
          }
        }
        await saveFile('images.pdf', await out.save(), 'application/pdf');
      }
    } catch (e) { toast('Something went wrong while building the PDF.'); }
    s.busy = false; draw();
  }
}

/* 10. PDF Audio Reader */
const pdfReaderState = { file: null, bytes: null, fullText: '', totalPages: 0, speed: 1.0, isPlaying: false, isPaused: false, statusText: 'Choose a PDF file to begin listening.' };

function renderPdfReader(el) {
  const s = pdfReaderState;
  el.innerHTML = head('PDF audio reader', 'Listen to your PDF documents out loud. Reads text directly in your browser using speech synthesis with no server uploads.') +
    '<div class="calc"><div class="inputs">' +

    '<option value="1.5"' + (s.speed === 1.5 ? ' selected' : '') + '>1.5x</option>' +

    '</select></label>' +
    '</div>' +
    '<div class="btnrow">' +
    '<button class="btn" id="pr_play"' + (!s.file ? ' disabled' : '') + '>Play</button>' +

    '</div>' +
    '</div>' +
    '<div class="panel stick" id="pr_out" aria-live="polite"></div></div>';

  const dropBox = $('#pr_drop', el);
  dropBox.innerHTML = dropHTML('.pdf,application/pdf', false, 'Choose a PDF to listen to', 'or drag and drop it here') +
    (s.file ? '<ul class="files" style="margin-top:14px"><li><span class="nm">' + esc(s.file.name) + '</span><span class="mt">' + s.totalPages + ' pages, ' + bytesFmt(s.file.size) + '</span><button class="ib" id="pr_rm" aria-label="Remove">\u2715</button></li></ul>' : '');

  bindDrop(dropBox, function (files) {
    if (files && files[0]) loadFile(files[0]);
  });

  const speedSelect = $('#pr_speed', el);
  speedSelect.onchange = function (e) {
    s.speed = parseFloat(e.target.value) || 1.0;

      startSpeech();
    }
  };

  const rmBtn = $('#pr_rm', dropBox);
  if (rmBtn) {
    rmBtn.onclick = function () {
      stopAudio();
      s.file = null;
      s.bytes = null;
      s.fullText = '';
      s.totalPages = 0;
      s.statusText = 'Choose a PDF file to begin listening.';
      remount(renderPdfReader);
    };

  $('#pr_play', el).onclick = function () {
    if (!('speechSynthesis' in window)) {
      toast('Text-to-speech is not supported in this browser.');
      return;
    }
    if (window.speechSynthesis.paused && s.isPaused) {
      window.speechSynthesis.resume();
      s.isPaused = false;
      s.isPlaying = true;
      s.statusText = 'Playing audio...';
      updateStatus();
      return;
    }
    startSpeech();
  };

  $('#pr_pause', el).onclick = function () {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
      window.speechSynthesis.pause();
      s.isPaused = true;
      s.statusText = 'Audio paused.';
      updateStatus();
    }
  };

  $('#pr_stop', el).onclick = function () {
    stopAudio();
    s.statusText = 'Audio stopped.';
    updateStatus();
  };

  cleanups.push(stopAudio);
  updateStatus();

  function stopAudio() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    s.isPlaying = false;
    s.isPaused = false;
  }

  async function loadFile(f) {
    if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') {
      toast('Please select a valid PDF file.');
      return;
    }
    stopAudio();
    s.file = f;
    s.statusText = 'Extracting text from PDF...';
    updateStatus();

    try {
      s.bytes = new Uint8Array(await f.arrayBuffer());
      await LIBS.pdfjs();
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const loadingTask = pdfjsLib.getDocument({ data: s.bytes });
      const pdf = await loadingTask.promise;
      s.totalPages = pdf.numPages;

      let extracted = '';
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const tc = await page.getTextContent();
        const pageText = tc.items.map(function (it) { return it.str; }).join(' ');
        if (pageText.trim()) extracted += pageText + ' ';
      }

      s.fullText = extracted.trim();
      if (!s.fullText) {
        s.statusText = 'No selectable text could be extracted from this PDF (it may be a scanned image).';
      } else {
        s.statusText = 'Ready to play (' + s.totalPages + ' pages loaded).';
      }
    } catch (err) {
      s.statusText = 'Could not read text: ' + (err.message || 'Unknown error');
    }
    remount(renderPdfReader);
  }

  function startSpeech() {
    if (!s.fullText) {
      toast('No extracted text available to read.');
      return;
    }
    stopAudio();
    const utterance = new SpeechSynthesisUtterance(s.fullText);
    utterance.rate = s.speed;
    utterance.onstart = function () {
      s.isPlaying = true;
      s.isPaused = false;
      s.statusText = 'Reading out loud...';

    utterance.onend = function () {
      s.isPlaying = false;
      s.isPaused = false;
      s.statusText = 'Finished reading entire document.';
      updateStatus();
    };
    utterance.onerror = function () {
      s.isPlaying = false;
      s.isPaused = false;
      s.statusText = 'Audio playback stopped or interrupted.';
      updateStatus();
    };
    window.speechSynthesis.speak(utterance);
  }

  function updateStatus() {
    const out = $('#pr_out', el);
    if (!out) return;
    const wordsCount = s.fullText ? s.fullText.split(/\s+/).filter(Boolean).length : 0;
    out.innerHTML = '<div class="muted">Audio Player Status</div>' +
      '<div class="words" style="margin-top:12px;font-size:1.05rem;color:var(--ink)"><b>' + esc(s.statusText) + '</b></div>' +
      '<div style="margin-top:20px">' +
      '<div class="row"><span>File loaded</span><b>' + (s.file ? esc(s.file.name) : 'None') + '</b></div>' +
      '<div class="row"><span>Total pages</span><b>' + s.totalPages + '</b></div>' +
      '<div class="row"><span>Extracted words</span><b>' + wordsCount.toLocaleString('en-IN') + '</b></div>' +
      '<div class="row"><span>Reading speed</span><b>' + s.speed + 'x</b></div>' +
      '</div>';
  }
}

function renderHome(el) {
  el.innerHTML = '<section class="hero"><h1>Small tools for money, files and everyday work.</h1>' +
    '<p class="lede">' + TOOLS.length + ' tools that run in your browser. Numbers, PDFs and photos never leave your device, and there is nothing to sign up for.</p></section>' +
    '<section class="index" aria-label="All tools">' + GROUPS.map(function (g) {
      return '<div class="igroup"><h2>' + g + '</h2><div>' + TOOLS.filter(function (t) { return t.group === g; }).map(function (t) {
        return '<a class="irow" href="#/' + t.id + '"><strong>' + t.name + '</strong><span>' + t.desc + '</span></a>';
      }).join('') + '</div></div>';
    }).join('') + '</section>' +
    '<footer class="sitefoot"><span>The website is developed by <b>Bittu</b> and designed by <b>LR AWM</b> support us by contributing on <b>upi id</b> bittulrawm@ybl contact to me at  <a href="mailto:bittukumar15031987@gmail.com">bittukumar15031987@gmail.com</a></span><span>Browser-native utilities</span></footer>';
}

function buildNav(filter) {
  const q = (filter || '').trim().toLowerCase();
  const html = GROUPS.map(function (g) {
    const items = TOOLS.filter(function (t) { return t.group === g && (!q || (t.name + ' ' + t.keys + ' ' + t.desc).toLowerCase().indexOf(q) >= 0); });
    if (!items.length) return '';
    return '<div class="ngroup"><div class="ngt">' + g + '</div>' + items.map(function (t) {
      return '<a class="nlink" href="#/' + t.id + '" data-id="' + t.id + '"' + (t.id === currentId ? ' aria-current="page"' : '') + '>' + t.name + '</a>';
    }).join('') + '</div>';
  }).join('');
  $('#navList').innerHTML = html || '<p class="muted small" style="padding:0 10px">No tool matches that search.</p>';
}
function closeNav() {
  $('#nav').classList.remove('open'); $('#scrim').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
}
function route() {
  cleanups.forEach(function (f) { try { f(); } catch (e) { } });
  cleanups = [];
  const id = (location.hash.replace(/^#\/?/, '') || '').split('?')[0];
  const t = TOOLS.find(function (x) { return x.id === id; });
  currentId = t ? t.id : '';
  $$('.nlink').forEach(function (a) { if (a.dataset.id === currentId) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.title = t ? t.name + ' | Saral' : 'Saral | Small tools for money, files and everyday work';
  remount(t ? t.render : renderHome);
  window.scrollTo(0, 0);
  closeNav();
}

/* theme */
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  const dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeBtn').textContent = dark ? 'Switch to light theme' : 'Switch to dark theme';
}
applyTheme(store.get('theme', null));
$('#themeBtn').addEventListener('click', function () {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark'; store.set('theme', next); applyTheme(next);
});

/* nav interactions */
$('#menuBtn').addEventListener('click', function () {
  const open = !$('#nav').classList.contains('open');
  $('#nav').classList.toggle('open', open); $('#scrim').classList.toggle('open', open); this.setAttribute('aria-expanded', String(open));
});
$('#scrim').addEventListener('click', closeNav);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeNav();
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === '/' && tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
    e.preventDefault(); $('#nav').classList.add('open'); $('#scrim').classList.add('open'); $('#q').focus();
  }
});
$('#q').addEventListener('input', function () { buildNav(this.value); });
$('#q').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { const a = $('#navList .nlink'); if (a) { location.hash = a.getAttribute('href'); this.value = ''; buildNav(''); this.blur(); } }
});
window.addEventListener('hashchange', route);

buildNav('');
route();
})();
</script>
</body>
</html>
