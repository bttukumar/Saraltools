<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saral | Small tools for money, files and everyday work</title>
<meta name="description" content="EMI, SIP, income tax, BMI, chart maker, PDF and image tools, converters, resume and invoice makers. Everything runs in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#12172B; --muted:#5D6379; --line:#E2E5EC; --soft:#EBEEF4;
  --accent:#F2A516; --accent-soft:#FCEFD0; --accent-text:#8A5600; --ok:#1B7F4B; --bad:#B42318;
  --font:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1020; --surface:#151A2F; --ink:#EEF0F8; --muted:#9BA1B9; --line:#262C48; --soft:#1C2242;
    --accent:#F4B23C; --accent-soft:#2C2818; --accent-text:#F4B23C; --ok:#4CC38A; --bad:#FF8F80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1020; --surface:#151A2F; --ink:#EEF0F8; --muted:#9BA1B9; --line:#262C48; --soft:#1C2242;
  --accent:#F4B23C; --accent-soft:#2C2818; --accent-text:#F4B23C; --ok:#4CC38A; --bad:#FF8F80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;height:auto;overflow-y:auto;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;height:auto;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:100;border-radius:0 0 8px 0}
.skip:focus{left:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.err{color:var(--bad)}
.note{color:var(--muted);font-size:.86rem;max-width:68ch;margin:20px 0 0}

/* shell layout */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;height:auto}
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 18px 24px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:1.35rem;letter-spacing:-.03em;text-decoration:none}
.brand::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:.92rem}
.ngroup{margin-bottom:14px}
.ngt{font-size:.8rem;color:var(--muted);padding:0 10px 4px}
.nlink{display:block;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:.95rem;color:var(--ink)}
.nlink:hover{background:var(--soft)}
.nlink[aria-current="page"]{background:var(--soft);font-weight:600}
.navfoot{margin-top:auto;font-size:.82rem;color:var(--muted)}
.navfoot p{margin:10px 0 0}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.86rem}
.topbar{display:none}
.scrim{display:none}
.main{padding:52px clamp(20px,5vw,72px) 110px;min-width:0;max-width:1180px;width:100%;height:auto}
.iconbtn{background:none;border:0;padding:8px;margin:-8px;cursor:pointer;border-radius:8px;display:inline-flex}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;min-height:auto}
  .topbar{display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
  .nav{position:fixed;z-index:40;top:0;left:0;bottom:0;width:min(84vw,320px);height:100%;background:var(--bg);padding-top:24px;padding-bottom:24px;transform:translateX(-102%);transition:transform .22s ease;border-right:1px solid var(--line)}
  .nav.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:30;background:rgba(10,12,24,.45)}
  .main{padding-top:32px}
}

/* headings */
.crumb{display:inline-block;font-size:.86rem;color:var(--muted);text-decoration:none;margin-bottom:18px}
.crumb:hover{color:var(--ink);text-decoration:underline}
.thead{margin-bottom:34px}
.thead h1{font-size:clamp(1.9rem,4.4vw,2.7rem);letter-spacing:-.03em;margin-bottom:10px}
.lede{color:var(--muted);max-width:60ch;margin:0;font-size:1.02rem}
.block{margin-top:44px}
.block>h2,.sub{font-size:1.15rem;margin:0 0 14px}
details.block>summary,details.fold>summary{cursor:pointer;font-weight:600;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.block>summary::-webkit-details-marker,details.fold>summary::-webkit-details-marker{display:none}
details.block>summary::before,details.fold>summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--soft);font-weight:500;line-height:1}
details[open].block>summary::before,details[open].fold>summary::before{content:"\2212"}
details.fold{margin:6px 0 26px;padding-top:14px;border-top:1px solid var(--line)}

/* home */
.hero h1{font-size:clamp(2.5rem,7vw,5rem);font-weight:500;letter-spacing:-.045em;line-height:1;max-width:15ch}
.hero .lede{margin-top:22px;font-size:1.12rem;max-width:52ch}
.index{margin-top:64px}
.igroup{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 32px;padding:26px 0;border-top:1px solid var(--line)}
.igroup h2{font-size:1.02rem}
.irow{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:2px 24px;padding:11px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow strong{font-weight:600;width:max-content;max-width:100%;text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:5px;transition:text-decoration-color .15s}
.irow:hover strong{text-decoration-color:var(--accent)}
.irow span{color:var(--muted)}
@media (max-width:700px){.igroup{grid-template-columns:1fr}.irow{grid-template-columns:1fr}}

/* calculators */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:start}
@media (max-width:1000px){.calc{grid-template-columns:minmax(0,1fr);gap:32px}}
.calc>.panel,.calc>.stick{position:sticky;top:24px}
@media (max-width:1000px){.calc>.panel,.calc>.stick{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px}
.field{margin-bottom:26px}
.field-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.field-top label{font-size:.92rem;color:var(--muted)}
.numwrap{display:inline-flex;align-items:baseline;gap:4px;border-bottom:1.5px solid var(--line);padding:1px 0;transition:border-color .15s}
.numwrap:focus-within{border-bottom-color:var(--ink)}
.numwrap i{font-style:normal;color:var(--muted);font-size:.95rem}
.num{border:0;background:transparent;font-weight:600;font-size:1.15rem;text-align:right;width:8.5em;padding:0;outline:none;font-variant-numeric:tabular-nums;min-width:0}
.num:focus-visible{outline:none}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;margin:0;--p:50%}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--ink) var(--p),var(--line) var(--p))}
.rng::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
.rng::-moz-range-progress{height:4px;border-radius:4px;background:var(--ink)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink);margin-top:-9px}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink)}
.rng:focus-visible{outline:none}
.rng:focus-visible::-webkit-slider-thumb{outline:2px solid var(--ink);outline-offset:3px}
.rng:focus-visible::-moz-range-thumb{outline:2px solid var(--ink);outline-offset:3px}

.big{font-size:clamp(2.6rem,6.4vw,4rem);font-weight:600;letter-spacing:-.04em;line-height:1.02;font-variant-numeric:tabular-nums;margin-top:6px;overflow-wrap:anywhere}
.big.mid{font-size:clamp(1.9rem,4vw,2.5rem)}
.words{color:var(--muted);margin-top:8px;font-size:.95rem;min-height:1.4em}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin:26px 0 12px}
.split>span{display:block;height:100%;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.split .a,.dot.a,.sw.a{background:var(--ink)}
.split .b,.dot.b,.sw.b{background:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row span:nth-child(2){flex:1;color:var(--muted)}
.row b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.legend{display:flex;gap:18px;font-size:.86rem;color:var(--muted);margin-top:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.93rem}
.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:8px 10px;white-space:nowrap}
.tbl td{text-align:right;padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.95rem;padding:11px 20px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;transition:transform .1s,opacity .15s,border-color .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{padding:7px 14px;font-size:.86rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;font-size:.9rem;color:var(--muted);padding:7px 15px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(10,12,30,.12)}
.field .seg{margin-top:2px}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.in:focus-visible{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
textarea.in{resize:vertical;min-height:70px;line-height:1.45}
select.in{appearance:auto}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted);min-width:0}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.chk-l{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.chk-l input{width:18px;height:18px;accent-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* drop + files */
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px dashed var(--line);border-radius:16px;padding:38px 20px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s;position:relative}
.drop strong{color:var(--ink)}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--ink);background:var(--surface)}
.files{margin:18px 0 0;padding:0;list-style:none}
.files li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.files .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .mt{color:var(--muted);font-size:.84rem;white-space:nowrap}
.files img{width:40px;height:40px;object-fit:cover;border-radius:6px;background:var(--soft)}
.ib{border:1px solid var(--line);background:transparent;border-radius:8px;width:32px;height:32px;cursor:pointer;line-height:1}
.ib:hover{border-color:var(--ink)}
.ib[disabled]{opacity:.3;cursor:not-allowed}
.imgprev{background:repeating-conic-gradient(var(--soft) 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:12px;display:grid;place-items:center;padding:10px;margin-bottom:18px;min-height:120px}
.imgprev img{max-width:100%;max-height:340px;object-fit:contain;display:block;border-radius:4px}

/* converter */
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin:24px 0}
@media (max-width:700px){.conv{grid-template-columns:1fr}}
.cv{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px}
.cv .val{width:100%;border:0;background:transparent;font-size:clamp(1.7rem,4vw,2.4rem);font-weight:600;letter-spacing:-.03em;outline:none;font-variant-numeric:tabular-nums;padding:0;margin-bottom:8px;min-width:0;overflow-wrap:anywhere}
.cv output.val{display:block}
.cv .val:focus-visible{outline:none}
.cv:focus-within{border-color:var(--ink)}
.cv select{width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0 0;color:var(--muted);font-size:.95rem}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.swap:hover{border-color:var(--ink)}
.ratesg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0}

/* planner */
.pbody{margin-top:26px;max-width:720px}
.datenav{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.datenav strong{font-size:1.15rem;min-width:11ch}
.addrow{display:flex;gap:10px;margin-bottom:18px}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.tasks li.empty,.empty{color:var(--muted);border-top:1px solid var(--line);padding:16px 0}
.tasks .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.tasks li.done .tx{color:var(--muted);text-decoration:line-through}
.chkb{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.chkb[aria-checked="true"]{background:var(--accent);border-color:var(--ink)}
.chkb[aria-checked="true"]::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.84rem;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.x:hover,.x.arm{color:var(--bad)}
.tfoot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-top:14px}
.hrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:16px 0;border-top:1px solid var(--line)}
.hname{flex:1 1 190px;min-width:0}
.hname b{display:block;font-weight:600;overflow-wrap:anywhere}
.hname small{color:var(--muted)}
.hdots{display:flex;gap:6px}
.hd{width:34px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);padding:0}
.hd.on{background:var(--accent);border-color:var(--ink);color:var(--ink);font-weight:700}
.hd.today{border-color:var(--ink)}
.in.jarea{min-height:260px;font-size:1.02rem;line-height:1.6}
.jlist{list-style:none;margin:0;padding:0}
.jlist button{display:flex;gap:16px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer}
.jlist b{flex:none;width:9.5em;font-weight:600}
.jlist span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* password */
.pwout{font-family:var(--mono);font-size:clamp(1.15rem,3vw,1.55rem);letter-spacing:.02em;word-break:break-all;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-height:5.2em;display:flex;align-items:center}
.meter{display:flex;gap:4px;margin:16px 0 8px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--ok)}
.meter.weak i.on{background:var(--bad)}
.meter.fair i.on{background:var(--accent)}

/* make: resume + invoice */
.mk{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:1100px){.mk{grid-template-columns:minmax(0,1fr)}.mk[data-view="edit"] .pv{display:none}.mk[data-view="preview"] .fm{display:none}}
@media (min-width:1101px){.viewseg{display:none}}
.viewseg{margin-bottom:22px}
.fm h3{font-size:1.02rem;margin:26px 0 12px}
.fm h3:first-child{margin-top:0}
.entry{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface)}
.pv{position:sticky;top:24px}
@media (max-width:1100px){.pv{position:static}}
.paperwrap{width:100%;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:#fff}
.paper{width:794px;min-height:1123px;background:#fff;color:#151826;padding:54px 58px;font-size:13px;line-height:1.45;transform-origin:top left;font-family:Arial,Helvetica,sans-serif}
.paper *{color:inherit}
.paper .mut{color:#5b6070}
.r-name{font-size:30px;font-weight:700;letter-spacing:-.01em;margin:0}
.r-title{font-size:15px;margin-top:2px;color:#4b5060}
.r-contact{font-size:11.5px;margin-top:8px;color:#5b6070}
.r-sec{font-size:11.5px;font-weight:700;letter-spacing:.03em;margin:18px 0 7px;padding-bottom:3px;border-bottom:1px solid #c9ccd6}
.r-item{margin-bottom:10px}
.r-line{display:flex;justify-content:space-between;gap:14px}
.r-line b{font-weight:700}
.r-sub{font-style:italic;color:#5b6070;font-size:12px}
.paper ul{margin:4px 0 0;padding-left:17px}
.paper li{margin:1px 0}
.paper p{margin:0}
.t-serif{font-family:'Times New Roman',Times,serif;font-size:14px}
.t-serif .r-head{text-align:center}
.t-serif .r-sec{text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.t-accent .r-head{border-bottom:3px solid #F2A516;padding-bottom:12px}
.t-accent .r-sec{color:#8A5600;border-bottom-color:#F2A516}
.i-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:28px}
.i-top h2{font-size:30px;font-weight:700;letter-spacing:-.02em;color:#151826}
.i-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;white-space:pre-line}
.i-tbl{width:100%;border-collapse:collapse;font-size:12px}
.i-tbl th{background:#f1f2f6;text-align:right;padding:7px 8px;font-weight:700}
.i-tbl td{padding:8px;border-bottom:1px solid #e3e5ec;text-align:right;vertical-align:top}
.i-tbl th:nth-child(2),.i-tbl td:nth-child(2){text-align:left;width:34%}
.i-tbl th:first-child,.i-tbl td:first-child{text-align:left;width:28px}
.i-tot{margin:16px 0 0 auto;width:56%;font-size:12.5px}

function parseNum(s) {

function bindFields(root, state, onChange) {

const seg = function (name, opts, cur) {

function stackedBars(data, aria) {
  const W = 640, H = 210, pl = 6, pr = 6, pt = 12, pb = 26, n = data.length;
  const max = Math.max(1, Math.max.apply(null, data.map(function (d) { return d.a + d.b; })));
  const bw = (W - pl - pr) / n, gap = Math.min(6, bw * 0.28), ch = H - pt - pb, yb = H - pb;
  const every = Math.ceil(n / 8);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">';
  data.forEach(function (d, i) {
    const x = pl + i * bw + gap / 2, w = Math.max(1, bw - gap), ha = d.a / max * ch, hb = d.b / max * ch;
    s += '<g><title>' + esc(d.tip || d.label) + '</title><rect x="' + x.toFixed(1) + '" y="' + (yb - ha).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + ha.toFixed(1) + '" fill="var(--ink)"/>' +
      '<rect x="' + x.toFixed(1) + '" y="' + (yb - ha - hb).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + hb.toFixed(1) + '" fill="var(--accent)"/></g>';
    if (i % every === 0 || i === n - 1) s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(d.label) + '</text>';
  });
  return s + '<line x1="0" x2="' + W + '" y1="' + yb + '" y2="' + yb + '" stroke="var(--line)"/></svg>';
}
function areaChart(pts, markX, markLabel, aria) {
  const W = 640, H = 230, pl = 8, pr = 8, pt = 22, pb = 28;
  const x0 = pts[0].x, x1 = pts[pts.length - 1].x, ymax = Math.max(1, Math.max.apply(null, pts.map(function (p) { return p.y; })));
  const X = function (x) { return pl + (x - x0) / Math.max(1, x1 - x0) * (W - pl - pr); };
  const Y = function (y) { return H - pb - y / ymax * (H - pt - pb); };
  const line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
  const area = line + ' L' + X(x1).toFixed(1) + ' ' + (H - pb) + ' L' + X(x0).toFixed(1) + ' ' + (H - pb) + ' Z';
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">' +
    '<path d="' + area + '" fill="var(--accent)" opacity=".28"/><path d="' + line + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';
  if (markX != null) {
    const mx = X(markX);
    s += '<line x1="' + mx + '" x2="' + mx + '" y1="' + pt + '" y2="' + (H - pb) + '" stroke="var(--muted)" stroke-dasharray="4 4"/>' +
      '<text x="' + mx + '" y="12" text-anchor="' + (mx > W * 0.7 ? 'end' : 'start') + '">' + esc(markLabel) + '</text>';
  }
  s += '<text x="' + pl + '" y="' + (H - 8) + '">Age ' + x0 + '</text><text x="' + (W - pr) + '" y="' + (H - 8) + '" text-anchor="end">Age ' + x1 + '</text>' +
    '<line x1="0" x2="' + W + '" y1="' + (H - pb) + '" y2="' + (H - pb) + '" stroke="var(--line)"/></svg>';
  return s;
}

function bindDrop(root, cb) {

    '</div><div class="panel stick">' +
    '<div class="imgprev" style="background:var(--surface);min-height:300px"><canvas id="cCanvas" width="720" height="500" style="width:100%;height:auto;display:block"></canvas></div>' +
    '<div class="btnrow"><button class="btn" id="cdl" type="button">Download PNG</button></div>' +
    '</div></div>';

  bindPaths(el, s, drawPreview);
  onSeg(el, 'ctype', function (v) { s.type = v; drawPreview(); });
  $('#cadd', el).onclick = function () {
    const p = ['#F2A516', '#1B7F4B', '#12172B', '#3B82F6', '#8B5CF6', '#EC4899'];
    s.items.push({ label: 'Item ' + (s.items.length + 1), val: 100, color: p[s.items.length % p.length] });
    drawList(); drawPreview();
  };
  function drawList() {
    const box = $('#citems', el);
    box.innerHTML = s.items.map(function (it, idx) {
      return '<div class="entry" style="display:grid;grid-template-columns:1fr 1fr 40px 30px;gap:8px;align-items:center;padding:10px">' +
        '<input class="in" style="padding:6px" placeholder="Label" data-idx="' + idx + '" data-k="label" value="' + esc(it.label) + '">' +
        '<input class="in" type="number" step="any" style="padding:6px" placeholder="Value" data-idx="' + idx + '" data-k="val" value="' + it.val + '">' +
        '<input type="color" data-idx="' + idx + '" data-k="color" value="' + (it.color || '#12172B') + '" style="border:0;background:none;width:100%;height:32px;cursor:pointer">' +
        (s.items.length > 1 ? '<button class="x" type="button" data-del="' + idx + '">✕</button>' : '<span></span>') + '</div>';
    }).join('');
    box.oninput = function (e) {
      const idx = e.target.dataset.idx, k = e.target.dataset.k;
      if (idx == null || !k) return;
      s.items[idx][k] = k === 'val' ? parseFloat(e.target.value) || 0 : e.target.value;
      drawPreview();
    };

      if (e.target.dataset.del != null) { s.items.splice(+e.target.dataset.del, 1); drawList(); drawPreview(); }
    };
  }
  function drawPreview() {
    const cv = $('#cCanvas', el); if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 720, H = cv.height = 500;
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#12172B'; ctx.font = 'bold 22px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(s.title || 'Chart', W / 2, 40);

    const valid = s.items.filter(function (it) { return it.val > 0; });
    const total = valid.reduce(function (a, b) { return a + b.val; }, 0);
    if (!valid.length || total <= 0) return;

    if (s.type === 'pie') {
      const cx = W / 2 - 80, cy = H / 2 + 10, r = 160;
      let start = -Math.PI / 2;
      valid.forEach(function (d) {
        const slice = (d.val / total) * (Math.PI * 2);
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, start + slice); ctx.closePath();
        ctx.fillStyle = d.color; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
        start += slice;
      });
      let ly = cy - (valid.length * 12);
      ctx.textAlign = 'left';
      valid.forEach(function (d) {
        ctx.fillStyle = d.color; ctx.fillRect(W - 200, ly - 10, 14, 14);
        ctx.fillStyle = '#12172B'; ctx.font = '13px system-ui';
        ctx.fillText(d.label + ' (' + ((d.val / total) * 100).toFixed(1) + '%)', W - 178, ly + 2);
        ly += 26;
      });
    } else if (s.type === 'bar') {
      const max = Math.max.apply(null, valid.map(function (d) { return d.val; }));
      const padL = 70, padR = 40, padB = 80, ch = H - padB - 70, cw = W - padL - padR, bw = cw / valid.length;
      ctx.strokeStyle = '#E2E5EC'; ctx.strokeRect(padL, H - padB, cw, 0);
      valid.forEach(function (d, i) {
        const bh = (d.val / max) * ch, bx = padL + i * bw + bw * 0.15, barW = bw * 0.7, by = H - padB - bh;
        ctx.fillStyle = d.color; ctx.fillRect(bx, by, barW, bh);
        ctx.fillStyle = '#12172B'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
        ctx.fillText(String(d.val), bx + barW / 2, by - 8);
        ctx.fillStyle = '#5D6379'; ctx.fillText(d.label, bx + barW / 2, H - padB + 20);
      });
    } else if (s.type === 'line') {
      const max = Math.max.apply(null, valid.map(function (d) { return d.val; }));
      const padL = 70, padR = 40, padB = 80, ch = H - padB - 70, cw = W - padL - padR, step = cw / Math.max(1, valid.length - 1);
      ctx.strokeStyle = '#12172B'; ctx.lineWidth = 3; ctx.beginPath();
      valid.forEach(function (d, i) {
        const px = padL + i * step, py = H - padB - (d.val / max) * ch;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();
      valid.forEach(function (d, i) {
        const px = padL + i * step, py = H - padB - (d.val / max) * ch;
        ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#12172B'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
        ctx.fillText(String(d.val), px, py - 12);
        ctx.fillStyle = '#5D6379'; ctx.fillText(d.label, px, H - padB + 20);
      });
    }
  }
  $('#cdl', el).onclick = function () {
    const cv = $('#cCanvas', el);
    if (cv) cv.toBlob(function (blob) { saveFile((s.title || 'chart').toLowerCase().replace(/\s+/g, '-') + '.png', blob); }, 'image/png');
  };
  drawList(); drawPreview();
}

function readImageEl(file) {
  return new Promise(function (res, rej) {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = function () { res({ img: img, url: url }); };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
async function rasterToPng(file) {
  const r = await readImageEl(file), c = document.createElement('canvas');
  c.width = r.img.naturalWidth; c.height = r.img.naturalHeight;
  c.getContext('2d').drawImage(r.img, 0, 0);
  URL.revokeObjectURL(r.url);
  const blob = await new Promise(function (res) { c.toBlob(res, 'image/png'); });
  return new Uint8Array(await blob.arrayBuffer());
}

};
function qrPayload(s) {
  const enc = function (x) { return encodeURIComponent(x.trim()).replace(/%40/g, '@'); };
  if (s.type === 'text') return s.text.trim();
  if (s.type === 'upi') {
    const u = s.upi; if (!u.pa.trim()) return '';
    let p = 'upi://pay?pa=' + enc(u.pa) + '&cu=INR';
    if (u.pn.trim()) p += '&pn=' + enc(u.pn);
    if (+u.am > 0) p += '&am=' + (+u.am).toFixed(2);
    if (u.tn.trim()) p += '&tn=' + enc(u.tn);
    return p;
  }
  const w = s.wifi; if (!w.ssid.trim()) return '';
  const e = function (t) { return t.replace(/([\\;,:"])/g, '\\$1'); };
  return 'WIFI:T:' + w.auth + ';S:' + e(w.ssid) + ';' + (w.auth === 'nopass' ? '' : 'P:' + e(w.pass) + ';') + ';';
}
function renderQr(el) {

    if (s.tab === 'qr') qrPane(b); else barPane(b);
  }

  function qrFields() {
    if (s.type === 'text') return fld('Link or text', 'text', s.text, { area: 1, rows: 3 });
    if (s.type === 'upi') return '<div class="frow">' + fld('UPI ID', 'upi.pa', s.upi.pa, { ph: 'name@bank' }) + fld('Payee name', 'upi.pn', s.upi.pn) + '</div><div class="frow">' + fld('Amount (\u20B9, optional)', 'upi.am', s.upi.am, { num: 1 }) + fld('Note (optional)', 'upi.tn', s.upi.tn) + '</div>';
    return '<div class="frow">' + fld('Network name', 'wifi.ssid', s.wifi.ssid) + fld('Password', 'wifi.pass', s.wifi.pass) + '</div>' + selHTML('Security', 'wifi.auth', s.wifi.auth, [['WPA', 'WPA or WPA2'], ['WEP', 'WEP'], ['nopass', 'None']]);
  }

  function qrPane(b) {
    b.innerHTML = '<div class="calc"><div class="inputs">' + seg('type', [['text', 'Link or text'], ['upi', 'UPI payment'], ['wifi', 'Wi-Fi']], s.type) +
      '<div style="margin:22px 0 16px" id="qf">' + qrFields() + '</div><div class="frow">' + selHTML('Image size', 'size', s.size, [['256', '256 px'], ['512', '512 px'], ['1024', '1024 px']]) +
      selHTML('Error correction', 'ecc', s.ecc, [['L', 'Low'], ['M', 'Medium'], ['Q', 'Quartile'], ['H', 'High']]) + '</div></div>' +
      '<div class="stick"><div class="qrbox" id="qout"><span class="muted">Preparing\u2026</span></div><div class="btnrow"><button class="btn" id="qdl" type="button">Download PNG</button></div></div></div>';
    const go = debounce(drawQr, 200);
    bindPaths(b, s, go);
    onSeg(b, 'type', function (v) { s.type = v; $('#qf', b).innerHTML = qrFields(); drawQr(); });
    $('#qdl', b).onclick = function () { if (s.canvas) s.canvas.toBlob(function (bl) { if (bl) saveFile('qr-code.png', bl); }, 'image/png'); };
    drawQr();

    async function drawQr() {
      const out = $('#qout', b); if (!out) return;
      const tok = ++s.tok, payload = qrPayload(s); s.canvas = null;
      if (!payload) { out.innerHTML = '<span class="muted">Fill in details.</span>'; return; }
      try { await LIBS.qr(); } catch (e) { out.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; return; }
      if (tok !== s.tok) return;
      const size = +s.size, tmp = document.createElement('div'); tmp.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(tmp);
      try {
        new QRCode(tmp, { text: payload, width: size, height: size, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel[s.ecc] });
        const src = tmp.querySelector('canvas'), pad = Math.round(size * 0.08), c = document.createElement('canvas');
        c.width = c.height = size + pad * 2;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(src, pad, pad);
        out.innerHTML = ''; out.appendChild(c); s.canvas = c;
      } catch (e) { out.innerHTML = '<span class="err">Data too large for QR.</span>'; }
      finally { tmp.remove(); }
    }
  }

  function barPane(b) {
    b.innerHTML = '<div class="calc"><div class="inputs">' + fld('Value', 'bc.text', s.bc.text) +
      '<div class="frow" style="margin-top:14px">' +
      selHTML('Format', 'bc.format', s.bc.format, [['CODE128', 'Code 128'], ['EAN13', 'EAN-13'], ['UPC', 'UPC-A'], ['CODE39', 'Code 39'], ['ITF14', 'ITF-14']]) +
      selHTML('Text below bars', 'bc.show', s.bc.show, [['yes', 'Show'], ['no', 'Hide']]) + '</div>' +
      '<div class="frow" style="margin-top:14px">' +
      fieldHTML({ key: 'bc.width', label: 'Bar width (scale)', min: 1, max: 6, step: 1, value: s.bc.width, fmt: 'int' }) +
      fieldHTML({ key: 'bc.height', label: 'Height (px)', min: 30, max: 200, step: 5, value: s.bc.height, fmt: 'int' }) +
      '</div>' +
      selHTML('Resolution / Quality', 'bc.scale', s.bc.scale, [['1', 'Standard (1x)'], ['2', 'High (2x Retinal)'], ['4', 'Ultra High Print (4x)']]) +
      '<p class="note" id="bhint" style="margin-top:8px"></p></div>' +
      '<div class="stick"><div class="qrbox" id="bout"><span class="muted">Preparing\u2026</span></div>' +
      '<div class="btnrow"><button class="btn" id="bpng" type="button">Download PNG</button><button class="btn ghost" id="bsvg" type="button">Download SVG</button></div></div></div>';

    const go = debounce(drawBar, 200);
    bindPaths(b, s, go);
    b.addEventListener('input', function (e) {
      if (e.target.dataset && e.target.dataset.key) {
        const k = e.target.dataset.key, val = parseFloat(e.target.value);
        if (k === 'bc.width') s.bc.width = val;
        if (k === 'bc.height') s.bc.height = val;
        go();
      }
    });

    $('#bpng', b).onclick = function () { if (s.canvas) s.canvas.toBlob(function (bl) { if (bl) saveFile('barcode.png', bl); }, 'image/png'); };
    $('#bsvg', b).onclick = function () {
      if (!s.canvas) return;
      try {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        JsBarcode(svg, s.bc.text, { format: s.bc.format, displayValue: s.bc.show === 'yes', width: s.bc.width, height: s.bc.height, fontSize: 18, margin: 15 });
        saveFile('barcode.svg', new XMLSerializer().serializeToString(svg), 'image/svg+xml');
      } catch (e) { toast('Error creating SVG.'); }
    };
    drawBar();

    async function drawBar() {
      const out = $('#bout', b); if (!out) return;
      set('bhint', BC_HINT[s.bc.format]); s.canvas = null;
      if (!s.bc.text) { out.innerHTML = '<span class="muted">Enter a value to see your barcode.</span>'; return; }
      try { await LIBS.bar(); } catch (e) { out.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; return; }

      const scale = +s.bc.scale || 2;
      const c = document.createElement('canvas');
      try {
        JsBarcode(c, s.bc.text, {
          format: s.bc.format,
          displayValue: s.bc.show === 'yes',
          lineColor: '#000000',
          background: '#ffffff',
          width: s.bc.width * scale,
          height: s.bc.height * scale,
          margin: 15 * scale,
          fontSize: 18 * scale
        });
        out.innerHTML = ''; out.appendChild(c); s.canvas = c;
      } catch (e) {
        out.innerHTML = '<span class="err">Invalid format for ' + esc(s.bc.format) + '. ' + esc(BC_HINT[s.bc.format]) + '</span>';
      }
    }
  }
}

/* Registry */
const TOOLS = [
  { id: 'emi', group: 'Money', name: 'EMI calculator', desc: 'Monthly instalment & schedules.', keys: 'loan emi', render: renderEmi },
  { id: 'sip', group: 'Money', name: 'SIP calculator', desc: 'Compounding & returns planner.', keys: 'invest sip', render: renderSip },
  { id: 'income-tax', group: 'Money', name: 'Income tax', desc: 'New vs Old tax regime breakdown.', keys: 'tax slab', render: renderTax },
  { id: 'retirement', group: 'Money', name: 'Retirement', desc: 'Corpus and savings milestone calculator.', keys: 'retire nps', render: renderRetire },
  { id: 'bmi', group: 'Everyday', name: 'BMI calculator', desc: 'Calculate Body Mass Index & ideal weight.', keys: 'health weight fitness', render: renderBmi },
  { id: 'pdf', group: 'Files', name: 'PDF toolkit', desc: 'Merge, split and extract PDF pages.', keys: 'pdf merge', render: renderPdf },
  { id: 'image', group: 'Files', name: 'Image toolkit', desc: 'Resize, compress and optimize photos.', keys: 'image convert', render: renderImage },
  { id: 'converter', group: 'Everyday', name: 'Converter', desc: 'Units of length, area, and temperature.', keys: 'convert unit', render: renderConv },
  { id: 'planner', group: 'Everyday', name: 'Planner', desc: 'Private tasks and streaks.', keys: 'todo notes', render: renderPlanner },
  { id: 'password', group: 'Everyday', name: 'Password generator', desc: 'Secure local randomized passkeys.', keys: 'password secure', render: renderPassword },
  { id: 'charts', group: 'Make', name: 'Graph & pie chart tool', desc: 'Generate customizable pie, bar and line graphs.', keys: 'chart graph pie bar statistics', render: renderChartMaker },
  { id: 'resume', group: 'Make', name: 'Resume builder', desc: 'Clean formatted professional CVs.', keys: 'cv resume jobs', render: renderResume },
  { id: 'invoice', group: 'Make', name: 'Invoice generator', desc: 'GST invoice maker with PDF export.', keys: 'bill invoice gst', render: renderInvoice },
  { id: 'qr', group: 'Make', name: 'QR and barcode', desc: 'Generate scannable codes quickly.', keys: 'qr barcode link', render: renderQr }
];
const GROUPS = ['Money', 'Files', 'Everyday', 'Make'];
let currentId = '';

function renderHome(el) {
  el.innerHTML = '<section class="hero"><h1>Small tools for money, files and everyday work.</h1>' +
    '<p class="lede">' + TOOLS.length + ' browser tools that run locally on your device. Zero cloud uploads, zero logins.</p></section>' +
    '<section class="index">' + GROUPS.map(function (g) {
      return '<div class="igroup"><h2>' + g + '</h2><div>' + TOOLS.filter(function (t) { return t.group === g; }).map(function (t) {
        return '<a class="irow" href="#/' + t.id + '"><strong>' + t.name + '</strong><span>' + t.desc + '</span></a>';
      }).join('') + '</div></div>';
    }).join('') + '</section>' +
    '<footer class="sitefoot"><span>The website is developed by <b>Bittu</b> my email to contact is <a href="mailto:bittukumar15031987@gmail.com">bittukumar15031987@gmail.com</a></span><span>Client-side tools</span></footer>';
}

function buildNav(filter) {
  const q = (filter || '').trim().toLowerCase();
  const html = GROUPS.map(function (g) {
    const items = TOOLS.filter(function (t) { return t.group === g && (!q || (t.name + ' ' + t.keys + ' ' + t.desc).toLowerCase().indexOf(q) >= 0); });
    if (!items.length) return '';
    return '<div class="ngroup"><div class="ngt">' + g + '</div>' + items.map(function (t) {
      return '<a class="nlink" href="#/' + t.id + '" data-id="' + t.id + '"' + (t.id === currentId ? ' aria-current="page"' : '') + '>' + t.name + '</a>';
    }).join('') + '</div>';
  }).join('');
  $('#navList').innerHTML = html || '<p class="muted small" style="padding:0 10px">No matching tools.</p>';
}

function closeNav() {
  $('#nav').classList.remove('open'); $('#scrim').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
}

function route() {
  cleanups.forEach(function (f) { try { f(); } catch (e) {} });
  cleanups = [];
  const id = (location.hash.replace(/^#\/?/, '') || '').split('?')[0];
  const t = TOOLS.find(function (x) { return x.id === id; });
  currentId = t ? t.id : '';
  $$('.nlink').forEach(function (a) { if (a.dataset.id === currentId) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.title = t ? t.name + ' | Saral' : 'Saral | Small tools for money, files and everyday work';
  remount(t ? t.render : renderHome);
  window.scrollTo(0, 0);
  closeNav();
}

function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  const dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeBtn').textContent = dark ? 'Switch to light theme' : 'Switch to dark theme';
}
applyTheme(store.get('theme', null));
$('#themeBtn').addEventListener('click', function () {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark'; store.set('theme', next); applyTheme(next);
});

$('#menuBtn').addEventListener('click', function () {
  const open = !$('#nav').classList.contains('open');
  $('#nav').classList.toggle('open', open); $('#scrim').classList.toggle('open', open); this.setAttribute('aria-expanded', String(open));
});
$('#scrim').addEventListener('click', closeNav);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeNav();
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === '/' && tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
    e.preventDefault(); $('#nav').classList.add('open'); $('#scrim').classList.add('open'); $('#q').focus();
  }
});
$('#q').addEventListener('input', function () { buildNav(this.value); });
$('#q').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { const a = $('#navList .nlink'); if (a) { location.hash = a.getAttribute('href'); this.value = ''; buildNav(''); this.blur(); } }
});
window.addEventListener('hashchange', route);

buildNav('');
route();
})();
</script>
